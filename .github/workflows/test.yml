# Tests are opt-in so pushes and pull requests never start suites implicitly.

name: test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung manually requested suite must still have a deadline.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # The structure manifest verifier needs historical hashes.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Milliseconds keep the manual run's budget precise.
      - name: npm test (budget, ADR-057 §D10)
        env:
          BUDGET_S: 120
        run: |
          start_ms=$(node -p 'Date.now()')
          npm test
          took_ms=$(( $(node -p 'Date.now()') - start_ms ))
          took=$(printf '%d.%03d' $((took_ms / 1000)) $((took_ms % 1000)))
          echo "npm test took ${took} s (budget ${BUDGET_S} s)"
          if [ "$took_ms" -gt $((BUDGET_S * 1000)) ]; then
            echo "::error title=Test budget exceeded::npm test took ${took} s, over the ${BUDGET_S} s budget (ADR-057 §D10)."
            exit 1
          fi
