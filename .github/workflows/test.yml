# fkit — run the test suite on every push to main and every pull request (task 0256).
#
# Why this exists alongside the in-release test gate in bin/release.mjs: the gate protects the
# TAGGED release, but install.sh defaults to `main`'s HEAD (install.sh:19, REF="${FKIT_REF:-main}"),
# so the default `curl | sh` install and the self-update path track main, not a tag. Every commit on
# main is live to every new install the moment it is pushed. The gate alone would protect the
# artifact almost nobody installs by default.
#
# The reverse is also true — CI cannot replace the gate. CI's verdict is asynchronous (release.mjs
# pushes the branch and the tag in one uninterrupted run), and CI never sees the working tree that
# `git add -A` actually ships.

name: test

on:
  push:
    branches: [main]
  pull_request:
  # So the first (possibly dash-red) run can be triggered on demand, without pushing to main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Basis: measured on THIS runner (ubuntu-latest), never locally — task 0395. Source: the 20
    # green `test` push runs from 81f1429 (2026-09-15, where 0388's mutations landed) to 4a21997
    # (2026-10-02); whole job 344-652 s. Slowest whole job: 652 s (10m52s), run 36984588959,
    # 2026-10-02 — its `npm test` step took 610 s, i.e. 66 s unit + 544 s prove-red.sh (split read
    # from the log timestamps). Slowest `npm test` step: 624 s, run 37051231177. Same-day runs of a
    # near-identical suite spread 7.4-10.9 min, so the basis is the slowest run, not the average.
    # All 20 carried prove-red.sh baselines 0a-0o and mutations 1-40 (incl. the basis run), except
    # the 6 before 3027cc7 (2026-09-21), which had 1-39. As of task 0395 the file has 43 mutations
    # and 16 clean baselines (0a against the real tree, 0b-0p against unmutated copies). Sprint 10's
    # additions (baseline 0p, mutations 41-43, a larger release suite, a new update-reinstall suite)
    # were NOT in the measured runs (estimated ~+1 min, unverified until a run carries them).
    # All of the above was measured while `npm test` still ran prove-red.sh; task 0529 (ADR-057) took
    # it out, and task 0530 re-sets this basis and the timeout.
    # 33 min = ~3.0x the slowest measured job (33 / 10.87), and still stops a hung run from burning a
    # runner for six hours. Re-measure when the suite grows: `gh run list --workflow
    # test.yml`, then `gh run view <id> --json jobs` for the job and step times.
    timeout-minutes: 33

    steps:
      - uses: actions/checkout@v4
        with:
          # ⚠️ MANDATORY, not tidiness. test/structure-manifest.test.js hard-refuses a shallow clone
          # (it checks `git rev-parse --is-shallow-repository`) because its manifest walk reads git
          # history ∪ the working tree. actions/checkout defaults to fetch-depth: 1, so without this
          # the suite dies at module load on every run.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # No `cache: npm` and no `npm ci` on purpose: fkit has zero dependencies and no lockfile
          # (ADR-014 §4). There is nothing to install and nothing to cache.

      - run: npm test
