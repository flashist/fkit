# Mutation checks are opt-in so they never consume a scheduled run.
name: prove-red

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:prove-red
