# The committed test switch also applies to manual workflow requests.
name: prove-red

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read test switch
        id: tests
        run: echo "enabled=$(node bin/run-tests.mjs --status)" >> "$GITHUB_OUTPUT"
      - name: Report disabled tests
        if: steps.tests.outputs.enabled == 'false'
        run: echo '::notice::Tests temporarily disabled. No tests ran; this is not a test pass.'
      - run: npm run test:prove-red
        if: steps.tests.outputs.enabled == 'true'
