# Automatic tests are paused by owner request; see CONTRIBUTING.md to restore them.
name: prove-red

on:
  # Uncomment to restore the nightly mutation tests.
  # schedule:
  #   - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-red:
    runs-on: ubuntu-latest
    # ~7x the ~2 min measured on the runner (job 123 s, step 118 s; run 39416272645, 2026-10-20).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # same checkout prove-red last ran green in (inside test.yml's job)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:prove-red
