# Owner-disabled; preserve triggers and steps for an explicitly approved reversal (CONTRIBUTING.md).
name: prove-red

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily; off the hour, which GitHub names as its busiest time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-red:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # same checkout prove-red last ran green in (inside test.yml's job)
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:prove-red
